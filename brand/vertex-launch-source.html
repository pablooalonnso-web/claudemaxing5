html,body{margin:0}
body{width:1920px;height:1080px;position:relative;overflow:hidden;background:#fff;font-family:DM,sans-serif;color:#3D3B4F}
.blob{position:absolute;border-radius:50%;filter:blur(140px);background:#3D3B4F;will-change:transform}
.b1{width:900px;height:600px;left:-260px;top:-260px;opacity:.2}
.b2{width:820px;height:600px;right:-240px;top:-240px;opacity:.19}
.b3{width:760px;height:460px;left:580px;bottom:-330px;opacity:.12}
.grid{position:absolute;inset:0;background:linear-gradient(90deg,rgba(61,59,79,.07) 1px,transparent 1px),linear-gradient(rgba(61,59,79,.07) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000 25%,transparent 72%)}
#stage{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,filter}
.el{position:absolute;opacity:0;will-change:transform,opacity,filter;left:0;top:0}
.h{font-family:IS;font-weight:700;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.h1{font-size:128px}.h2{font-size:92px}.sub{font-family:DM;font-size:30px;color:#5f5d6e;letter-spacing:-.01em;white-space:nowrap}
.w{display:inline-block;margin-right:.24em}
.center{width:1920px;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:30px;font-family:IS;font-weight:700;font-size:150px;letter-spacing:-.05em}
.brand svg{width:160px;height:160px}
.card{background:#fff;border:1px solid rgba(61,59,79,.14);border-radius:22px;box-shadow:0 26px 60px -30px rgba(61,59,79,.55),0 2px 8px rgba(61,59,79,.06);padding:20px 24px;font-size:18px;line-height:1.3;white-space:nowrap}
.card .t{display:flex;align-items:center;gap:14px;font-family:IS;font-weight:600;font-size:22px}
.card img{width:36px;height:36px;border-radius:50%}
.card .row{display:flex;gap:36px;margin-top:14px}
.card .k{font-size:14px;color:#6b6979}.card .v{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.up{color:#1c9a69}

.chip{display:inline-flex;align-items:center;gap:12px;padding:16px 22px;border-radius:16px;background:#fff;border:1px solid rgba(61,59,79,.14);box-shadow:0 18px 40px -22px rgba(61,59,79,.5);font-family:IS;font-weight:600;font-size:24px;white-space:nowrap}
